name: Playwright Tests in Docker

on:
  push:
    branches: [main, master, les30-tests-github-actions]
  pull_request:
    branches: [main, master, les30-tests-github-actions]
  workflow_dispatch:

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright:v1.39.0-jammy
      options: --init --ipc=host

    env:
      BASE_URL: https://guest:welcome2qauto@qauto.forstudy.space/
      HTTP_USERNAME: guest
      HTTP_PASSWORD: welcome2qauto
      USER_EMAIL: kureninovavika2@gmail.com
      USER_PASSWORD: Test1234A
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install project dependencies
        run: npm ci

      - name: Run Playwright tests
        run: PW_CLI_IGNORE_VERSION_CHECK=1 npx playwright test